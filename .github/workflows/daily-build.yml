name: Daily static build

# Architecture note: this workflow is the entire "runtime" of the ArkaFon
# Jamstack stack. It fires once per day after TEFAS close, regenerates the
# five static JSON payloads, and pushes them into the frontend repo. Vercel
# then redeploys from that commit.

on:
  schedule:
    # 19:15 UTC daily — comfortably after TEFAS publishes the day's parquet.
    - cron: '15 19 * * *'
  workflow_dispatch:
    inputs:
      market_period:
        description: 'yfinance lookback for market_data (e.g. 5y, 1y, 30d)'
        required: false
        default: '5y'

concurrency:
  group: arkafon-daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout arkafon-be
        uses: actions/checkout@v4
        with:
          path: be
          ref: feat/static-site

      - name: Checkout arkafon-fe
        uses: actions/checkout@v4
        with:
          repository: cansincomert/arkafon-fe
          ref: feat/static-site
          path: fe
          token: ${{ secrets.ARKAFON_FE_PUSH_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: be/requirements.txt

      - name: Install Python dependencies
        working-directory: be
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape TEFAS (updater)
        working-directory: be
        run: python -m src.updater

      - name: Build master_flow_data.parquet (data_loader)
        working-directory: be
        run: python -m src.data_loader

      - name: Refresh currency markers (market_data)
        working-directory: be
        run: python -m src.market_data ${{ github.event.inputs.market_period || '5y' }}

      - name: Export static JSON payloads
        working-directory: be
        run: python -m src.export_json --target ../fe/public/data/

      - name: Show payload diff
        working-directory: fe
        run: |
          git status --short public/data/
          git --no-pager diff --stat public/data/ || true

      - name: Commit & push to arkafon-fe
        working-directory: fe
        run: |
          git config user.name "arkafon-bot"
          git config user.email "arkafon-bot@users.noreply.github.com"
          git add public/data/
          if git diff --cached --quiet; then
            echo "No payload changes; skipping push."
            exit 0
          fi
          git commit -m "chore(data): daily static build $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4; do
            if git push origin feat/static-site; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            sleep $((2 ** attempt))
          done
          echo "Push failed after 4 attempts." >&2
          exit 1
