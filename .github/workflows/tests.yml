name: Tests

# Runs the pytest suite on every PR to feat/static-site (and on direct
# pushes to feat/static-site / main as a safety net for the daily-build
# workflow that lives alongside this one).

on:
  pull_request:
    branches: [feat/static-site, main]
  push:
    branches: [feat/static-site, main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v --tb=short
